# podman configuration (~/.config/containers/containers.conf).
#
# Only exists to state the Rosetta setting explicitly. It changes no podman
# behaviour: podman 5.6 disabled Rosetta in machine VMs by default ("due to
# issues with newer Linux kernels"), this host runs podman 6.0.1, and
# podman-machine-default's own stored config already records "Rosetta":false.
# This file just says out loud what the machine is already doing.
#
# What it does fix is Podman Desktop. Its `isRosettaEnabled()` returns true
# whenever this file is missing or has no `[machine] rosetta` key, and it then
# "verifies" Rosetta by running `arch -arch x86_64 uname -m`. That resolves
# `uname` through PATH, where this machine's GNU coreutils
# (/opt/homebrew/opt/coreutils/libexec/gnubin/uname) shadows Apple's — and the
# Homebrew ARM build is arm64-only, so the exec dies with "Bad CPU type in
# executable". Podman Desktop reads that as "Rosetta is not installed" and
# prompts to install it on every machine start. It is a false positive:
# `arch -arch x86_64 /usr/bin/uname -m` prints x86_64, and the nix-rosetta-builder
# VM translates x86_64-linux builds fine. Declaring rosetta here makes Podman
# Desktop skip the check entirely.
#
# If a future podman re-enables Rosetta in machine VMs and x86 container
# emulation is wanted, flip this to true — but only after confirming Podman
# Desktop no longer runs its PATH-resolved probe, or the prompt returns.
[machine]
rosetta = false
